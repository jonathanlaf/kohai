<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kohai</title>
<meta name="description" content="Fiches d'étude des kata du Club de Karaté Traditionnel Chaleurs : esprit du kata, embusen, mouvements illustrés, vidéos et lexique japonais.">
<meta name="color-scheme" content="light dark">
<link rel="alternate" hreflang="fr" href="/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="x-default" href="/">
<script>
  (function () {
    try {
      var t = localStorage.getItem('kohai-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      // Reader's language: the saved choice, else the browser's (first of fr/en in its list), saved once.
      // Only the home page follows it; deep links keep their language. Print and crawlers are never redirected.
      if (!/[?&]print=/.test(location.search) && !/bot|crawl|spider|slurp/i.test(navigator.userAgent)) {
        var lang = localStorage.getItem('kohai-lang');
        if (lang !== 'fr' && lang !== 'en') {
          var langs = navigator.languages || [navigator.language || ''];
          lang = 'fr';
          for (var i = 0; i < langs.length; i++) {
            var p = String(langs[i]).slice(0, 2).toLowerCase();
            if (p === 'fr' || p === 'en') { lang = p; break; }
          }
          localStorage.setItem('kohai-lang', lang);
        }
        if (lang === 'en' && (location.hash === '' || location.hash === '#/')) location.replace('en/' + location.hash);
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/print.css" media="print">
<script src="assets/app.js" defer></script>
</head>
<body>

  <nav class="crumbs" aria-label="Fil d'Ariane">
    <a class="brand" href="#/">Kohai <span class="brand-jp">後輩</span></a>
    <span class="crumb" id="crumb" hidden></span>
  </nav>
  <div class="tools">
    <a id="lang-link" class="lang-link" href="en/" hreflang="en" lang="en" aria-label="English version">EN</a>
    <div class="theme-switch" role="group" aria-label="Thème">
      <button type="button" data-theme-choice="light" aria-pressed="false">Clair</button>
      <button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">Sombre</button>
    </div>
    <span class="print-tools" id="print-tools" hidden>
      <label class="paper"><span class="visually-hidden">Format du papier</span>
        <select id="paper-size">
          <option value="letter">Lettre</option>
          <option value="a4">A4</option>
        </select>
      </label>
      <a id="print-link" class="print-btn" href="#" target="_blank" rel="noopener">Imprimer</a>
    </span>
  </div>
</header>

<div class="layout" id="layout">
  <nav class="toc-web" id="toc-web" aria-label="Sections" hidden>
    <details id="toc-details" open>
      <summary id="toc-title">Sections</summary>

    </details>
  </nav>

    </footer>
  </main>
</div>
</body>
</html>
