<!doctype html>
<html lang="en" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kohai</title>
<meta name="description" content="Study notes on the kata of the Club de Karaté Traditionnel Chaleurs: spirit of the kata, embusen, illustrated moves, videos and Japanese vocabulary.">
<meta name="color-scheme" content="light dark">
<link rel="alternate" hreflang="fr" href="/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="x-default" href="/">
<script>
  (function () {
    try {
      var t = localStorage.getItem('kohai-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      // A first visit through the English site makes English the reader's language (see index.html)
      if (!localStorage.getItem('kohai-lang')) localStorage.setItem('kohai-lang', 'en');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/print.css" media="print">
<script src="../assets/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a class="brand" href="#/">Kohai <span class="brand-jp">後輩</span></a>
    <span class="crumb" id="crumb" hidden></span>
  </nav>
  <div class="tools">
    <a id="lang-link" class="lang-link" href="../" hreflang="fr" lang="fr" aria-label="Version française">FR</a>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
    </div>
    <span class="print-tools" id="print-tools" hidden>
      <label class="paper"><span class="visually-hidden">Paper size</span>
        <select id="paper-size">
          <option value="letter">Letter</option>
          <option value="a4">A4</option>
        </select>
      </label>
      <a id="print-link" class="print-btn" href="#" target="_blank" rel="noopener">Print</a>
    </span>
  </div>
</header>

<div class="layout" id="layout">
  <nav class="toc-web" id="toc-web" aria-label="Sections" hidden>
    <details id="toc-details" open>
      <summary id="toc-title">Sections</summary>
      <ol class="toc" id="toc"></ol>
    </details>
  </nav>
  <main id="view" tabindex="-1">
    <p class="loading">Loading…</p>
    <noscript><p>This page needs JavaScript to show the study notes.</p></noscript>
    <footer class="site-foot">
      <span>Kohai <span class="jp" lang="ja">後輩</span> · a student’s notes</span>
      <span class="site-updated" id="site-updated" hidden></span>
      <a href="#/a-propos">About</a>

    </footer>
  </main>
</div>
</body>
</html>
